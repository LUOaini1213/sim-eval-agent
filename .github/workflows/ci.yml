name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SUMO 1.24.0 and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Point SUMO_HOME at the pip-installed SUMO
        run: |
          echo "SUMO_HOME=$(python -c 'import sumo; print(sumo.SUMO_HOME)')" >> "$GITHUB_ENV"

      - name: SUMO version
        run: sumo --version | head -n 1

      - name: Network is byte-reproducible from the script
        run: python scripts/build_network.py --check

      - name: Unit + integration tests
        run: python -m pytest -q

      - name: Committed results are consistent and README numbers match them
        run: |
          python scripts/verify_results.py
          python scripts/render_readme.py --check

      - name: Smoke run of the agent against SUMO
        run: |
          python scripts/run_agent.py --smoke --out smoke_results --jobs 2
          python scripts/verify_results.py --dir smoke_results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke_results/
